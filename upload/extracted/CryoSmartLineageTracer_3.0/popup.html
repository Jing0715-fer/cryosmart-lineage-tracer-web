<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 420px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2933;
      background: #fff;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 12px;
      color: #52606d;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      border: 1px solid #ccd5df;
      border-radius: 6px;
      font-size: 13px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .checks {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #52606d;
    }
    .checks label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checks input {
      width: auto;
      margin: 0;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #0b74de;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      background: #9fb3c8;
      cursor: default;
    }
    #status {
      min-height: 36px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      color: #52606d;
    }
    textarea {
      height: 190px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <label for="projectId">Project</label>
      <input id="projectId" placeholder="P52">
    </div>
    <div>
      <label for="startJob">从哪个 Job 开始</label>
      <input id="startJob" placeholder="427">
    </div>
  </div>

  <label for="jobsJson">Project metadata JSON，可选</label>
  <input id="jobsJson" type="file" accept=".json,application/json">

  <button id="exportBtn">可选：导出当前 Project 全部 metadata</button>
  <button id="analyzeBtn">追溯颗粒和 Map 来源</button>

  <div class="checks">
    <label><input id="downloadPptx" type="checkbox" checked> 生成流程图 PPTX（图片嵌入）</label>
    <label><input id="downloadImages" type="checkbox" checked> 下载流程图图片（micrograph / select 2D / map 预览）</label>
    <label><input id="downloadMaps" type="checkbox"> 下载流程图涉及的 map / MRC</label>
    <label><input id="downloadFinalResults" type="checkbox"> 下载最终 Job 结果包（FSC / Guinier / Direction / 6 个 Map）</label>
  </div>

  <button id="downloadBtn" disabled>下载追溯报告</button>

  <div id="status">可以直接追溯目标 Job；插件会按需打开上游 Metadata。全量导出 Project metadata 只是可选备份。</div>
  <label for="preview">结果预览</label>
  <textarea id="preview" readonly></textarea>

  <script src="popup.js"></script>
</body>
</html>
